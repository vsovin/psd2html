<?xml version="1.0" encoding="UTF-8"?>
<!--
  Логотип VirshkeTech (основной, для светлого фона).
  ПЛЕЙСХОЛДЕР: повторяет пропорции и цвета оригинала заказчика
  (тёмно-синий квадрат #0B3C6B, белая двойная диагональная молния,
  надпись VIRSHKE + research & development).
  ЗАМЕНИТЬ на оригинальный вектор, сохранив имя файла logo.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72" role="img" aria-label="VirshkeTech — логотип">
  <!-- Квадрат бренда -->
  <rect x="0" y="4" width="64" height="64" rx="10" fill="#0B3C6B"/>
  <!-- Белая диагональная молния в две полосы -->
  <polygon points="36,12 16,40 27,40 21,60 46,30 33,30 42,12" fill="#FFFFFF"/>
  <polygon points="48,16 34,38 41,38 36,54 54,30 45,30 52,16" fill="#FFFFFF" opacity="0.85"/>
  <!-- Надпись -->
  <text x="78" y="42" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" letter-spacing="1" fill="#0B3C6B">VIRSHKE</text>
  <text x="78" y="60" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="0.5" fill="#0B3C6B">research &amp; development</text>
</svg>
