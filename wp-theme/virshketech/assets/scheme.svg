<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Схема токарного станка с осью ТФО-160 и модулями">
  <style>
    .base { fill: #1c2430; stroke: #27313f; stroke-width: 2; }
    .metal { fill: #2b3648; stroke: #3d4a5e; stroke-width: 1.5; }
    .line { stroke: #3d4a5e; stroke-width: 2; fill: none; }
    .txt { font: 600 11px system-ui, sans-serif; fill: #8b98a9; }
    .mod { fill: #2b3648; stroke: #3d4a5e; stroke-width: 1.5; transition: all .25s ease; }
    .mod.on { fill: #ff6a1a; stroke: #ff8c4a; }
    .axis { fill: #ff6a1a; opacity: .9; }
  </style>

  <!-- станина -->
  <rect class="base" x="20" y="220" width="480" height="46" rx="8"/>
  <text class="txt" x="34" y="248">Станина</text>

  <!-- шпиндельная бабка -->
  <rect class="metal" x="40" y="120" width="90" height="100" rx="6"/>
  <circle class="metal" cx="150" cy="170" r="26"/>
  <circle cx="150" cy="170" r="10" fill="#0d1117" stroke="#3d4a5e" stroke-width="2"/>

  <!-- суппорт / резцедержатель -->
  <rect class="metal" x="250" y="100" width="60" height="44" rx="4"/>
  <path class="line" d="M280 144 L280 168 L262 176"/>

  <!-- ТФО-160 (четвёртая ось) -->
  <g id="tfo">
    <rect class="axis" x="330" y="150" width="70" height="40" rx="8"/>
    <circle cx="415" cy="170" r="14" fill="#ff6a1a"/>
    <text class="txt" x="322" y="212" fill="#ff8c4a">ТФО-160</text>
  </g>

  <!-- задняя бабка -->
  <g id="m-tailstock" class="mod" data-mod="tailstock">
    <rect x="440" y="140" width="52" height="80" rx="6"/>
    <path class="line" d="M440 180 L410 180" stroke="#8b98a9"/>
  </g>

  <!-- модуль автозажима тисков -->
  <g id="m-vise" class="mod" data-mod="vise">
    <rect x="238" y="180" width="84" height="40" rx="6"/>
  </g>

  <!-- модуль автоматизации патрона -->
  <g id="m-chuck" class="mod" data-mod="chuck">
    <circle cx="150" cy="170" r="34" fill="none"/>
    <path d="M128 148 A34 34 0 0 1 172 148 L166 162 A26 26 0 0 0 134 162 Z"/>
  </g>

  <!-- робот подачи заготовок -->
  <g id="m-robot" class="mod" data-mod="robot">
    <rect x="40" y="30" width="70" height="34" rx="6"/>
    <path class="line" d="M75 64 L75 96 L120 118" stroke-width="4"/>
  </g>

  <text class="txt" x="430" y="132">Задняя бабка</text>
  <text class="txt" x="246" y="238" >Тиски</text>
  <text class="txt" x="36" y="24">Робот подачи</text>
  <text class="txt" x="96" y="118">Патрон</text>
</svg>
